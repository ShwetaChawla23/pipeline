name: Terraform Plan

on:
  push:
    branches:
      - feature

  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Init Validate Plan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Terraform Init
      - name: Terraform Init
        working-directory: ./parent module
        run: terraform init

      # 5. Terraform Validate
      - name: Terraform Validate
        working-directory: ./parent module
        run: terraform validate

      # 6. Terraform Plan
      - name: Terraform Plan
        working-directory: ./parent module
        run: terraform plan -input=false